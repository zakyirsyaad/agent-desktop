<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=Geist+Mono:wght@400&amp;display=swap"></head>
<body>
<div class="z-stage">
  <button class="z-btn z-btn--primary" type="button"><svg class="z-ico" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Allow once</button>
  <button class="z-btn z-btn--outline" type="button">Always allow</button>
  <button class="z-btn z-btn--ghost" type="button">Cancel</button>
  <button class="z-btn z-btn--danger" type="button"><svg class="z-ico" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>Deny</button>
  <button class="z-btn z-btn--outline" type="button" disabled>Check again</button>
</div>
</body>
</html>
