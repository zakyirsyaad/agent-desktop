<!doctype html>
<html>
<head><meta charset="utf-8"><title>PermissionCard — preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=Geist+Mono:wght@400&amp;display=swap"></head>
<body>
<div class="z-col">
  <div class="z-permission" role="group" aria-label="Permission request">
    <div class="z-permission__head"><svg class="z-ico" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>Claude Code wants to run a command</div>
    <p class="z-permission__body">It will install dependencies in this workspace.</p>
    <pre>pnpm install</pre>
    <div class="z-permission__actions">
      <button class="z-btn z-btn--primary" type="button"><svg class="z-ico" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Allow once</button>
      <button class="z-btn z-btn--outline" type="button">Always allow</button>
      <button class="z-btn z-btn--danger" type="button"><svg class="z-ico" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>Deny</button>
    </div>
  </div>
</div>
</body>
</html>
