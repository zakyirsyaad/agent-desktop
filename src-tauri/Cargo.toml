[package]
name = "agent-desktop"
version = "0.1.0"
description = "Generic Desktop GUI Wrapper for Terminal Coding Agents"
authors = ["zakyirsyaad <zkyxentertain@gmail.com>"]
edition = "2021"

[lib]
name = "agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
