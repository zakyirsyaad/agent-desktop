[package]
name = "agent-desktop"
version = "0.2.0"
description = "Generic Desktop GUI Wrapper for Terminal Coding Agents"
authors = ["zakyirsyaad <zkyxentertain@gmail.com>"]
edition = "2021"

[lib]
name = "agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-notification = "=2.6.0"
portable-pty = "0.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
url = "2"

[dev-dependencies]
sha2 = "0.11.1"

