[package]
name = "zorvo"
version = "0.4.1"
description = "Every coding agent, one desktop."
authors = ["zakyirsyaad <zkyxentertain@gmail.com>"]
edition = "2021"

[lib]
name = "zorvo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-notification = "=2.7.0"
portable-pty = "0.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.23"
url = "2"
regex = "1"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
sha2 = "0.11.1"
flate2 = "1"
tar = { version = "0.4", default-features = false }
bzip2 = { version = "0.5", default-features = false, features = ["libbz2-rs-sys"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDictionary", "NSString", "NSUserDefaults", "NSValue"] }
