# The desktop app is the root package; the marketing site lives in site/.
packages:
  - "."
  - "site"

minimumReleaseAgeExclude:
  - lucide-react@1.57.0

allowBuilds:
  esbuild: true
  # Its install script would write git hooks unasked: run `pnpm lefthook install` to opt in.
  lefthook: false
  # Next.js image optimizer; the site exports static images unoptimized, so it is not needed.
  sharp: false
