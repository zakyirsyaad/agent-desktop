name: Feature request
description: Suggest something Zorvo could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, not yet the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working; a screenshot of a similar app is welcome.
  - type: dropdown
    id: agents
    attributes:
      label: Which agents does it concern?
      multiple: true
      options: [Qwen Code, Claude Code, Codex, Oh-My-Pi, Aider, All of them]
